<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-8 sm:p-10 border border-slate-100 text-center transform transition-all">
    
    <!-- 1. 프로필 사진 (같은 폴더에 'profile.jpg' 사진을 넣거나 아래 src의 파일명을 수정해 주세요) -->
    <div class="relative w-32 h-32 mx-auto mb-6">
      <img 
        src="profile.jpg" 
        alt="프로필 사진" 
        class="w-full h-full rounded-full object-cover shadow-md ring-4 ring-slate-50"
        onerror="this.onerror=null; this.src='https://placehold.co/300x300/e2e8f0/475569?text=Profile';"
      >
    </div>

    <!-- 2. 이름 -->
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-2">
      김미진
    </h1>

    <!-- 3. 한 줄 소개 -->
    <p class="text-indigo-600 font-medium text-sm sm:text-base mb-6">
      디지털라이프코치
    </p>

    <div class="w-12 h-1 bg-indigo-100 mx-auto rounded-full mb-6"></div>

    <!-- 4. 3~4줄 자기소개 -->
    <p class="text-slate-600 text-sm sm:text-base leading-relaxed break-keep">
      만나서 반갑습니다
    </p>

  </main>

</body>
</html>
